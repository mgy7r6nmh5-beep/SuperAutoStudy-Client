server:
  port: 3030

spring:
  application:
    name: SuperAutoStudy
  # 不再依赖被 .gitignore 排除的 application-dev.yml：仓库内配置即可启动。
  # 本地单机运行不需要注册中心，关闭 Nacos 发现与配置，避免启动时连不上 8848。
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
